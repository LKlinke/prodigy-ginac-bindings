# Publishes a release when a tag v<version> is pushed (e.g. v0.0.1); setuptools-scm takes the version from
# the tag. The PyPI trusted publisher of prodigy-ppl-ginac must be set up for this file name and the
# environment "release"; renaming either breaks publishing.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions: { }

jobs:
  dist:
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  pypi:
    name: publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers approve the release here; the job below waits for this one.
    environment:
      name: release
      url: https://pypi.org/project/prodigy-ppl-ginac/
    permissions:
      # trusted publishing, no token
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # all artifacts of the run: the wheels-* and the sdist
          path: dist/
          merge-multiple: true
      - name: Check that the distributions carry the version of the tag
        run: |
          ls dist
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/prodigy_ppl_ginac-${version}.tar.gz"
          ! ls dist/*.whl | grep -v -- "prodigy_ppl_ginac-${version}-"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # all artifacts of the run: the wheels-* and the sdist
          path: dist/
          merge-multiple: true
      - name: Create the release with generated notes and the distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
